# General Comments: Main application configuration using H2 database in persistent file mode.

spring.application.name=library-management-system

# H2 persistent file-mode database stored under ./data/db/ (excluded from Git)
spring.datasource.url=jdbc:h2:file:./data/db/lms;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 console for local development inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
